<svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Elegant dark background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>

    <!-- Subtle glow -->
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark professional background -->
  <rect width="1024" height="1024" fill="url(#bgGradient)"/>

  <!-- Minimalist initial circle -->
  <circle cx="512" cy="400" r="180" fill="none" stroke="#334155" stroke-width="2" opacity="0.3"/>
  <circle cx="512" cy="400" r="160" fill="none" stroke="#475569" stroke-width="1" opacity="0.5"/>

  <!-- Professional initial "F" -->
  <text x="512" y="470" font-family="Georgia, serif" font-size="220" font-weight="400" fill="#f1f5f9" text-anchor="middle" filter="url(#subtleGlow)">
    F
  </text>

  <!-- Clean separator line -->
  <line x1="412" y1="550" x2="612" y2="550" stroke="#475569" stroke-width="1" opacity="0.4"/>

  <!-- Name - elegant and personal -->
  <text x="512" y="650" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="300" fill="#e2e8f0" text-anchor="middle" letter-spacing="6">
    FRIZIX
  </text>

  <!-- Professional title -->
  <text x="512" y="710" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="300" fill="#94a3b8" text-anchor="middle" letter-spacing="2">
    Direct Contact
  </text>

  <!-- Minimal status indicator -->
  <circle cx="512" cy="780" r="5" fill="#10b981" opacity="0.8"/>
  <text x="512" y="825" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#64748b" text-anchor="middle" letter-spacing="1">
    Available
  </text>
</svg>