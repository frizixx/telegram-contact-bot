<!-- ФИНАЛЬНАЯ ВЕРСИЯ: Океанская глубина -->
<svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ocean">
      <stop offset="0%" style="stop-color:#001a33;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#002b4d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000d1a;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="light-beam">
      <stop offset="0%" style="stop-color:#4dd0e1;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#4dd0e1;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4dd0e1;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#80deea;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4dd0e1;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- Океанский фон -->
  <rect width="1024" height="1024" fill="url(#ocean)"/>

  <!-- Световые лучи (более интенсивные) -->
  <ellipse cx="512" cy="200" rx="400" ry="600" fill="url(#light-beam)"/>
  <ellipse cx="350" cy="300" rx="200" ry="400" fill="url(#light-beam)" opacity="0.5"/>
  <ellipse cx="650" cy="250" rx="180" ry="450" fill="url(#light-beam)" opacity="0.4"/>

  <!-- Дополнительные световые эффекты -->
  <ellipse cx="200" cy="400" rx="150" ry="300" fill="url(#light-beam)" opacity="0.2"/>
  <ellipse cx="824" cy="500" rx="120" ry="280" fill="url(#light-beam)" opacity="0.25"/>

  <!-- Центральные круги с эффектом волн -->
  <circle cx="512" cy="450" r="190" fill="none" stroke="#00bcd4" stroke-width="2" opacity="0.3"/>
  <circle cx="512" cy="450" r="210" fill="none" stroke="#00acc1" stroke-width="1" opacity="0.2"/>
  <circle cx="512" cy="450" r="230" fill="none" stroke="#00838f" stroke-width="1" opacity="0.15"/>

  <!-- Дополнительные декоративные круги -->
  <circle cx="512" cy="450" r="170" fill="none" stroke="#26c6da" stroke-width="1" opacity="0.2"/>

  <!-- Инициал F (чёткий, без размытия) -->
  <text x="512" y="520" font-family="Gill Sans, sans-serif" font-size="200" font-weight="300" fill="#80deea" text-anchor="middle">F</text>

  <!-- Волнистые линии (верхняя и нижняя) -->
  <path d="M 312,600 Q 412,590 512,600 T 712,600" stroke="#26c6da" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 312,610 Q 412,605 512,610 T 712,610" stroke="#00bcd4" stroke-width="1" fill="none" opacity="0.2"/>

  <!-- Имя FRIZIX (шрифт Humane) -->
  <text x="512" y="720" font-family="Humane, sans-serif" font-size="70" font-weight="400" fill="#b2ebf2" text-anchor="middle" letter-spacing="22">FRIZIX</text>

  <!-- Декоративная линия под именем -->
  <line x1="362" y1="745" x2="662" y2="745" stroke="url(#shimmer)" stroke-width="1.5" opacity="0.5"/>

  <!-- @FrizixConnectingBot -->
  <text x="512" y="795" font-family="system-ui" font-size="20" fill="#4dd0e1" text-anchor="middle" letter-spacing="1" opacity="0.75">@FrizixConnectingBot</text>

  <!-- Статус с улучшенной анимацией -->
  <circle cx="512" cy="870" r="6" fill="#00e5ff" opacity="0.8">
    <animate attributeName="cy" values="870;860;870" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Дополнительные маленькие световые частицы (вместо пузырей - светящиеся точки) -->
  <circle cx="320" cy="320" r="2" fill="#80deea" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="380" r="1.5" fill="#4dd0e1" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="580" r="2.5" fill="#80deea" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="540" r="2" fill="#4dd0e1" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.15;0.6" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Плавающие световые линии (эффект света под водой) -->
  <path d="M 100,250 Q 200,240 300,250" stroke="#26c6da" stroke-width="1" fill="none" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0.3;0.15" dur="6s" repeatCount="indefinite"/>
  </path>
  <path d="M 724,200 Q 824,190 924,200" stroke="#00bcd4" stroke-width="1" fill="none" opacity="0.12">
    <animate attributeName="opacity" values="0.12;0.25;0.12" dur="5.5s" repeatCount="indefinite"/>
  </path>
</svg>