# fly.toml app configuration file generated for telegram-contact-bot
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'telegram-contact-bot-markw'
primary_region = 'ams'

[build]

[env]

# No HTTP service - this is a Telegram bot using long polling
# Remove http_service section completely

[experimental]
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[processes]
  app = "node bot.js"
