<!-- Реалистичный вариант 1: Космический минимализм -->
<svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="space1">
      <stop offset="0%" style="stop-color:#0d1b2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#space1)"/>
  <!-- Звёзды -->
  <circle cx="120" cy="180" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="890" cy="240" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="200" cy="850" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="750" cy="120" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="950" cy="700" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="80" cy="500" r="1.5" fill="#ffffff" opacity="0.6"/>
  <!-- Планета -->
  <circle cx="512" cy="512" r="220" fill="#1a2332" filter="url(#glow1)"/>
  <ellipse cx="512" cy="512" rx="220" ry="40" fill="none" stroke="#3d5a80" stroke-width="3" opacity="0.4"/>
  <!-- Текст -->
  <text x="512" y="820" font-family="system-ui" font-size="68" font-weight="300" fill="#e0e1dd" text-anchor="middle" letter-spacing="12">FRIZIX</text>
  <circle cx="512" cy="880" r="4" fill="#00d9ff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>