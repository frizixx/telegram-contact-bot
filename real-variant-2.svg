<!-- Реалистичный вариант 2: Матовое стекло (iOS стиль) -->
<svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ios1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#ios1)"/>
  <!-- Размытые круги -->
  <circle cx="300" cy="300" r="200" fill="#ffffff" opacity="0.2" filter="url(#blur1)"/>
  <circle cx="700" cy="700" r="250" fill="#ffffff" opacity="0.15" filter="url(#blur1)"/>
  <!-- Стеклянная панель -->
  <rect x="212" y="412" width="600" height="200" rx="30" fill="#ffffff" opacity="0.15"/>
  <rect x="212" y="412" width="600" height="200" rx="30" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <!-- Текст -->
  <text x="512" y="540" font-family="-apple-system, system-ui" font-size="88" font-weight="600" fill="#ffffff" text-anchor="middle">Frizix</text>
  <circle cx="512" cy="750" r="8" fill="#ffffff" opacity="0.8"/>
  <text x="512" y="805" font-family="system-ui" font-size="24" fill="#ffffff" text-anchor="middle" opacity="0.7">Available</text>
</svg>