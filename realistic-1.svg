<!-- Реалистичный 1: Глубокий космос с туманностью -->
<svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="nebula">
      <stop offset="0%" style="stop-color:#1a0033;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#0d1b3d;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1e0a3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="purple-glow">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="blue-glow">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Космический фон -->
  <rect width="1024" height="1024" fill="url(#nebula)"/>

  <!-- Туманность -->
  <circle cx="400" cy="300" r="250" fill="url(#purple-glow)" opacity="0.3"/>
  <circle cx="650" cy="700" r="280" fill="url(#blue-glow)" opacity="0.25"/>

  <!-- Звёзды разного размера -->
  <circle cx="150" cy="200" r="2.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="890" cy="180" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="200" cy="800" r="3" fill="#ffffff" opacity="1"/>
  <circle cx="800" cy="150" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="950" cy="650" r="2.5" fill="#ffffff" opacity="0.85"/>
  <circle cx="100" cy="550" r="2" fill="#ffffff" opacity="0.75"/>
  <circle cx="700" cy="900" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="300" cy="100" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="500" cy="850" r="1.8" fill="#ffffff" opacity="0.7"/>
  <circle cx="850" cy="450" r="2.2" fill="#ffffff" opacity="0.8"/>

  <!-- Далёкие звёзды -->
  <circle cx="400" cy="600" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="600" cy="250" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="250" cy="450" r="1" fill="#ffffff" opacity="0.4"/>

  <!-- Центральное свечение -->
  <circle cx="512" cy="512" r="180" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.2"/>
  <circle cx="512" cy="512" r="200" fill="none" stroke="#8b5cf6" stroke-width="0.5" opacity="0.15"/>

  <!-- Инициал с свечением -->
  <text x="512" y="570" font-family="Georgia, serif" font-size="220" font-weight="300" fill="#e0e7ff" text-anchor="middle" filter="url(#glow)">F</text>

  <!-- Имя -->
  <text x="512" y="720" font-family="system-ui" font-size="56" font-weight="200" fill="#cbd5e1" text-anchor="middle" letter-spacing="16">FRIZIX</text>

  <!-- Статус индикатор -->
  <circle cx="512" cy="800" r="6" fill="#22d3ee" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <text x="512" y="850" font-family="system-ui" font-size="18" fill="#94a3b8" text-anchor="middle" letter-spacing="2">DIRECT LINE</text>
</svg>