<!-- Реалистичный 3: Тёмный бетон с неоном -->
<svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="concrete" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1c1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c2c2e;stop-opacity:1" />
    </linearGradient>
    <filter id="neon-glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="neon-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ffff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Бетонный фон с текстурой -->
  <rect width="1024" height="1024" fill="url(#concrete)"/>

  <!-- Текстура бетона (шум) -->
  <rect width="1024" height="1024" fill="#000000" opacity="0.03"/>
  <circle cx="200" cy="300" r="1" fill="#ffffff" opacity="0.05"/>
  <circle cx="800" cy="150" r="1" fill="#ffffff" opacity="0.04"/>
  <circle cx="400" cy="700" r="1" fill="#ffffff" opacity="0.06"/>
  <circle cx="600" cy="900" r="1" fill="#ffffff" opacity="0.05"/>

  <!-- Неоновая рамка -->
  <rect x="212" y="312" width="600" height="400" rx="8" fill="none" stroke="url(#neon-blue)" stroke-width="3" opacity="0.6" filter="url(#neon-glow)"/>

  <!-- Неоновый инициал -->
  <text x="512" y="560" font-family="Impact, sans-serif" font-size="240" font-weight="400" fill="url(#neon-blue)" text-anchor="middle" filter="url(#neon-glow)">F</text>

  <!-- Имя -->
  <text x="512" y="780" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#e5e5e7" text-anchor="middle" letter-spacing="12">FRIZIX</text>

  <!-- Линия -->
  <line x1="362" y1="820" x2="662" y2="820" stroke="url(#neon-blue)" stroke-width="2" opacity="0.5"/>

  <!-- Статус -->
  <circle cx="512" cy="880" r="5" fill="#00ff88" filter="url(#neon-glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="512" y="920" font-family="monospace" font-size="16" fill="#8e8e93" text-anchor="middle" letter-spacing="3">● ONLINE 24/7</text>
</svg>