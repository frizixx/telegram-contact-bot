<!-- Реалистичный 4: Чёрный мрамор с золотом -->
<svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="marble-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f0f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffed4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:1" />
    </linearGradient>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Мраморный фон -->
  <rect width="1024" height="1024" fill="url(#marble-bg)"/>

  <!-- Мраморные прожилки -->
  <path d="M 100,300 Q 300,280 500,320 T 900,300" stroke="#2a2a2a" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 50,500 Q 250,480 450,520 T 850,500" stroke="#1f1f1f" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M 150,700 Q 350,680 550,720 T 950,700" stroke="#2a2a2a" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Золотой круг -->
  <circle cx="512" cy="450" r="200" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.6" filter="url(#soft-glow)"/>
  <circle cx="512" cy="450" r="180" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.3"/>

  <!-- Золотой инициал -->
  <text x="512" y="510" font-family="Didot, serif" font-size="180" font-weight="400" fill="url(#gold)" text-anchor="middle" filter="url(#soft-glow)">F</text>

  <!-- Золотая линия -->
  <line x1="362" y1="580" x2="662" y2="580" stroke="url(#gold)" stroke-width="2" opacity="0.5"/>

  <!-- Имя -->
  <text x="512" y="700" font-family="Didot, serif" font-size="68" font-weight="300" fill="#f5f5f5" text-anchor="middle" letter-spacing="16">FRIZIX</text>

  <!-- Подзаголовок -->
  <text x="512" y="760" font-family="system-ui" font-size="22" fill="#999999" text-anchor="middle" letter-spacing="6">EXCLUSIVE CONTACT</text>

  <!-- Статус -->
  <circle cx="512" cy="850" r="6" fill="url(#gold)" opacity="0.8"/>
  <text x="512" y="900" font-family="system-ui" font-size="18" fill="#777777" text-anchor="middle" letter-spacing="3">AVAILABLE</text>
</svg>