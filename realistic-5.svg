<!-- Реалистичный 5: Океанская глубина -->
<svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ocean">
      <stop offset="0%" style="stop-color:#001a33;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#002b4d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000d1a;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="light-beam">
      <stop offset="0%" style="stop-color:#4dd0e1;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#4dd0e1;stop-opacity:0" />
    </radialGradient>
    <filter id="water-glow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Океанский фон -->
  <rect width="1024" height="1024" fill="url(#ocean)"/>

  <!-- Световые лучи -->
  <ellipse cx="512" cy="200" rx="400" ry="600" fill="url(#light-beam)"/>
  <ellipse cx="350" cy="300" rx="200" ry="400" fill="url(#light-beam)" opacity="0.5"/>
  <ellipse cx="650" cy="250" rx="180" ry="450" fill="url(#light-beam)" opacity="0.4"/>

  <!-- Пузырьки воздуха -->
  <circle cx="200" cy="700" r="4" fill="#4dd0e1" opacity="0.6"/>
  <circle cx="850" cy="600" r="3" fill="#4dd0e1" opacity="0.5"/>
  <circle cx="300" cy="850" r="5" fill="#4dd0e1" opacity="0.7"/>
  <circle cx="750" cy="800" r="3.5" fill="#4dd0e1" opacity="0.5"/>
  <circle cx="150" cy="500" r="4.5" fill="#4dd0e1" opacity="0.6"/>

  <!-- Центральный круг с эффектом воды -->
  <circle cx="512" cy="450" r="190" fill="none" stroke="#00bcd4" stroke-width="2" opacity="0.3"/>
  <circle cx="512" cy="450" r="210" fill="none" stroke="#00acc1" stroke-width="1" opacity="0.2"/>

  <!-- Инициал с подсветкой -->
  <text x="512" y="520" font-family="Gill Sans, sans-serif" font-size="200" font-weight="300" fill="#80deea" text-anchor="middle" filter="url(#water-glow)">F</text>

  <!-- Волнистая линия -->
  <path d="M 312,600 Q 412,590 512,600 T 712,600" stroke="#26c6da" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Имя -->
  <text x="512" y="720" font-family="system-ui" font-size="58" font-weight="200" fill="#b2ebf2" text-anchor="middle" letter-spacing="14">FRIZIX</text>

  <!-- Подзаголовок -->
  <text x="512" y="780" font-family="system-ui" font-size="20" fill="#4dd0e1" text-anchor="middle" letter-spacing="4" opacity="0.7">Deep Connection</text>

  <!-- Статус с анимацией -->
  <circle cx="512" cy="860" r="6" fill="#00e5ff" opacity="0.8">
    <animate attributeName="cy" values="860;850;860" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>